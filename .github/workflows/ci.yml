# Unit and API tests against a local app, and an end-to-end check of the Docker
# image. Runs on pushes to main, pull requests and before every release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

jobs:
  test:
    name: Unit and API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Write local test settings
        run: |
          umask 077
          {
            echo "DATABASE_URL=postgres://papersign:$(openssl rand -hex 16)@127.0.0.1:54376/papersign"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "APP_URL=http://127.0.0.1:3176"
            echo "HOST=127.0.0.1"
            echo "PORT=3176"
            echo "DATA_DIR=.local/data"
            echo "SMTP_HOST=127.0.0.1"
            echo "SMTP_PORT=2526"
            echo "SMTP_SECURE=false"
            echo "SMTP_FROM=PaperSign Test <papersign@example.invalid>"
          } > .env
          mkdir -p .local/logs
      - name: Start the database and the synthetic mailbox
        run: |
          nohup npm run dev:db > .local/logs/db.log 2>&1 &
          nohup node --import tsx scripts/dev-mail.ts > .local/logs/mail.log 2>&1 &
          for attempt in $(seq 90); do
            grep -q "PostgreSQL ready" .local/logs/db.log && exit 0
            sleep 2
          done
          cat .local/logs/db.log
          exit 1
      - run: npm run db:migrate
      - run: npm run build
      - name: Start PaperSign
        run: |
          nohup npm start > .local/logs/web.log 2>&1 &
          nohup npm run worker > .local/logs/worker.log 2>&1 &
          for attempt in $(seq 60); do
            curl -fsS http://127.0.0.1:3176/api/health > /dev/null && exit 0
            sleep 1
          done
          cat .local/logs/web.log
          exit 1
      - run: npm test
      - name: Show service logs
        if: failure()
        run: tail -n 200 .local/logs/*.log

  docker:
    name: Docker image end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The smoke test uses the command-line client and PDF libraries.
      - run: npm ci --no-audit --no-fund
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: papersign:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Write try-out settings
        working-directory: docker
        run: |
          umask 077
          {
            echo "APP_URL=http://127.0.0.1:3176"
            echo "OPERATOR_NAME=PaperSign CI"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "COMPOSE_PROFILES=try-out"
            echo "SMTP_HOST=mailpit"
            echo "SMTP_PORT=1025"
            echo "SMTP_REQUIRE_TLS=false"
            echo "SMTP_FROM=PaperSign CI <papersign@example.test>"
            echo "PAPERSIGN_IMAGE=papersign:ci"
          } > .env
      - name: Start the stack
        run: docker compose -f docker/compose.yaml up -d --wait --no-build
      - name: Smoke test
        env:
          BOOTSTRAP_COMMAND: docker compose -f docker/compose.yaml exec -T web papersign bootstrap-admin --email {email}
        run: node docker/smoke-test.mjs
      - name: Restart and check the same data
        run: |
          docker compose -f docker/compose.yaml down
          docker compose -f docker/compose.yaml up -d --wait --no-build
          node docker/smoke-test.mjs --after-restart
      - name: Show container logs
        if: failure()
        run: docker compose -f docker/compose.yaml logs --no-color --tail 200
